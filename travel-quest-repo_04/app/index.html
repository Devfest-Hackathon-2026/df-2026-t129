<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRAVEL QUEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-outer:#E6F2F3; --paper:#FFFFFF; --mist:#EFF8F8; --line:#D3E6E8;
  --ink:#10303A; --ink2:#4A6770;
  --primary:#08686B; --on-primary:#FFFFFF; --teal-2:#0E9AA0; --aqua:#8FD9DF;
  --amber:#E58A00; --amber-bg:#FFF3DE; --amber-ink:#7A4300;
  --ok-bg:#DDF3F1; --danger:#B3261E;
  --game:'DotGothic16','Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',monospace;
  --sans:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-outer:#0A1418; --paper:#0F1E24; --mist:#152A31; --line:#27444D;
    --ink:#E4F3F5; --ink2:#9DBCC4;
    --primary:#5FD0D4; --on-primary:#062226; --teal-2:#5FD0D4; --aqua:#2C7C82;
    --amber:#FFAE3D; --amber-bg:#3A2A10; --amber-ink:#FFD28A;
    --ok-bg:#12363A; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-outer:#0A1418; --paper:#0F1E24; --mist:#152A31; --line:#27444D;
  --ink:#E4F3F5; --ink2:#9DBCC4;
  --primary:#5FD0D4; --on-primary:#062226; --teal-2:#5FD0D4; --aqua:#2C7C82;
  --amber:#FFAE3D; --amber-bg:#3A2A10; --amber-ink:#FFD28A;
  --ok-bg:#12363A; --danger:#FF8A80;
  color-scheme:dark;
}

/* color vision friendly palette (blue / orange / reddish purple; no red-green pairs) */
:root[data-cb="1"]{--primary:#0B5CAD;--teal-2:#0072B2;--aqua:#9CCBEB;--amber:#E69F00;--amber-bg:#FFF1D1;--amber-ink:#6B4300;--ok-bg:#DCEBFA;--danger:#9C1F63}
@media (prefers-color-scheme:dark){:root[data-cb="1"]:not([data-theme="light"]){--primary:#7DBBF2;--on-primary:#06192E;--teal-2:#7DBBF2;--aqua:#2A5F8F;--amber:#FFC24D;--amber-bg:#3A2D0E;--amber-ink:#FFDDA0;--ok-bg:#12304D;--danger:#F29BC8}}
:root[data-cb="1"][data-theme="dark"]{--primary:#7DBBF2;--on-primary:#06192E;--teal-2:#7DBBF2;--aqua:#2A5F8F;--amber:#FFC24D;--amber-bg:#3A2D0E;--amber-ink:#FFDDA0;--ok-bg:#12304D;--danger:#F29BC8}
.segs{display:flex;gap:6px;padding:10px 16px 0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 55px);background:var(--paper);z-index:15}
.segs button{flex:1;min-height:44px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;font-weight:700;font-size:13px;padding:4px 2px}
.segs button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg-outer);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
@media (min-width:480px){#app{box-shadow:0 0 0 1px var(--line),0 12px 48px rgba(8,50,56,.14)}}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.logo{font-family:var(--game);font-size:19px;letter-spacing:.04em;color:var(--primary);flex:1;white-space:nowrap}
.logo b{color:var(--amber);font-weight:400}
.back{border:0;background:var(--mist);border-radius:10px;padding:6px 10px;font-weight:700;color:var(--primary)}
.gearbtn{border:0;background:none;padding:0;min-width:44px;min-height:44px;display:grid;place-items:center;font-size:26px;line-height:1;color:var(--ink);border-radius:12px}
.gearbtn:active{background:var(--mist)}
.lang{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 11px;font-weight:700;font-size:13px}

/* common */
.pad{padding:16px 16px 8px}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:17px}
.muted{color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);border-radius:12px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--primary)}
.btn.warn{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#2B1700}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--mist);border:1px solid var(--line);color:var(--ink2)}
.tag.done{background:var(--ok-bg);color:var(--primary);border-color:var(--primary)}
.tag.warn{background:var(--amber-bg);color:var(--amber-ink);border-color:var(--amber)}

/* home */
.hero{padding:26px 18px 18px;background:linear-gradient(180deg,var(--mist),var(--paper))}
.hero h1{font-size:27px;line-height:1.35;font-weight:700;letter-spacing:.01em}
.hero p{margin:8px 0 0;color:var(--ink2)}
.hero .route{display:block;margin:16px 0 0;width:100%;height:46px}
.tripcard{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.tripcard:hover{border-color:var(--teal-2)}
.tripcard .t{font-weight:700;font-size:16px}
.tripcard .m{font-size:13px;color:var(--ink2)}
.form{background:var(--mist);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.field{display:block;margin:0 0 10px}
.field span{display:block;font-size:13px;font-weight:700;margin-bottom:3px}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:12px;color:var(--ink2);padding:14px 18px 6px}

/* trip header + stats */
.thead{padding:14px 16px 4px}
.thead h1{font-size:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px 6px}
.stat{border:1.5px solid var(--line);border-radius:12px;padding:6px 4px 7px;text-align:center;background:var(--paper)}
.stat .l{font-size:11px;color:var(--ink2);font-weight:700}
.stat .v{font-family:var(--game);font-size:18px;line-height:1.2}
.stat .bar{height:5px;background:var(--line);border-radius:3px;margin:4px 8px 0;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--teal-2)}

/* days */
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 4px}
.day{flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:5px 12px;text-align:center;min-width:64px}
.day b{display:block;font-size:14px}
.day small{font-size:11px;color:var(--ink2)}
.day[aria-selected="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.day[aria-selected="true"] small{color:inherit}

.steps{margin:10px 16px 0;border:1.5px dashed var(--teal-2);border-radius:12px;padding:10px 12px;background:var(--mist)}
.steps .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px}
.steps .pb{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:7px 0}
.steps .pb i{display:block;height:100%;background:var(--teal-2)}
.steps input{width:110px;border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--paper);min-height:40px}

/* timeline */
.tl{list-style:none;margin:6px 16px 0;padding:0}
.stop{position:relative;display:grid;grid-template-columns:42px 26px minmax(0,1fr) auto 46px;gap:8px;align-items:start;padding:10px 0}
.stop::before{content:"";position:absolute;left:61px;top:0;bottom:0;width:2px;background:var(--line)}
.stop-time{font-family:var(--game);font-size:15px;padding-top:2px;color:var(--ink2)}
.stop-mark{position:relative;z-index:1;width:26px;height:26px;display:grid;place-items:center;font-size:14px;background:var(--paper);border:2px solid var(--teal-2);border-radius:50%}
.stop-mark.cat-sight{border-radius:5px;transform:rotate(45deg)}
.stop-mark.cat-sight span{transform:rotate(-45deg);display:block}
.stop-mark.cat-move{border-radius:6px;border-style:dotted}
.stop-mark.cat-other{border-style:dashed}
.stop.is-done .stop-mark{background:var(--ok-bg);border-color:var(--primary)}
.stop-body{min-width:0;cursor:pointer;background:none;border:0;text-align:left;padding:0}
.stop-title{font-weight:700;line-height:1.35}
.stop.is-done .stop-title{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink2)}
.stop-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:3px;font-size:12px;color:var(--ink2)}
.stop-ph img{width:50px;height:50px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);display:block;cursor:pointer}
.qbox{width:44px;height:44px;border-radius:10px;font-family:var(--game);font-size:22px;line-height:1;display:grid;place-items:center;border:2px dashed var(--amber);background:var(--amber-bg);color:var(--amber-ink);padding:0}
.qbox.q-seen{border-style:solid}
.qbox.q-done{border-style:solid;border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.add{margin:8px 16px 0}
.empty{margin:18px 16px;padding:18px;border:1.5px dashed var(--line);border-radius:14px;text-align:center;color:var(--ink2)}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{border:0;background:none;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:700;color:var(--ink2);min-height:50px}
.nav button .i{font-size:19px;line-height:1.1}
.nav button[aria-current="page"]{color:var(--primary);background:var(--mist);box-shadow:inset 0 -3px 0 var(--primary)}

/* quests */
.sec{padding:14px 16px 2px}
.sec h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 small{font-size:12px;font-weight:700;color:var(--ink2)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pq{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 12px}
.pq .e{font-size:26px;line-height:1.1}
.pq .n{font-weight:700;margin-top:2px}
.pq .r{font-size:12px;color:var(--amber-ink);background:var(--amber-bg);border-radius:8px;padding:1px 7px;display:inline-block;margin-top:4px}
.pq .c{font-size:12px;color:var(--ink2);margin-top:3px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1.5px solid var(--line);cursor:pointer;display:block}
.qlist{list-style:none;padding:0;margin:10px 0 0}
.qlist li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qlist .s{font-family:var(--game);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;border:2px dashed var(--amber);color:var(--amber-ink);background:var(--amber-bg)}
.qlist .s.d{border:2px solid var(--primary);background:var(--primary);color:var(--on-primary)}

/* boss tab */
.bosscard{margin:12px 16px;border-radius:16px;padding:16px;background:var(--mist);color:var(--ink);text-align:center;border:1.5px solid var(--line)}
.bosscard .nm{font-weight:700;font-size:18px;margin-top:6px}
.bosscard .sb{font-size:13px;color:var(--ink2)}
.vsrow{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.vsrow>div:first-child svg{width:80px}
.vsrow>div:last-child svg{width:130px}
.vsrow svg{height:auto;display:block;image-rendering:pixelated}
.vsx{font-family:var(--game);font-size:22px;color:var(--amber-ink);padding-bottom:34px}
.power{margin:12px 16px}
.power .bars{position:relative;height:16px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0}
.power .bars i{display:block;height:100%;background:var(--teal-2)}
.power .bars b{position:absolute;top:0;bottom:0;width:3px;background:var(--amber)}

/* memories */
.mhero{margin:12px 16px;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--teal-2));color:var(--on-primary)}
.mhero h2{font-size:20px}
.mhero p{margin:4px 0 0;font-size:13px;opacity:.92}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 16px}
.mstats div{border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.mstats b{display:block;font-family:var(--game);font-size:19px}
.mstats span{font-size:11px;color:var(--ink2);font-weight:700}
.mday{margin:14px 16px 0}
.mday h3{font-size:15px;margin-bottom:6px}
.mitem{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mitem img{width:52px;height:52px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line)}
.mitem .t{font-weight:700;line-height:1.35}
.mitem .m{font-size:12px;color:var(--ink2)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(5,25,30,.55)}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet h2{font-size:18px;margin-bottom:4px}
.qreward{margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--amber-bg);color:var(--amber-ink);font-weight:700}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:1.5px solid var(--line);margin:8px 0}
.verdict{border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700}
.verdict.ok{background:var(--ok-bg);color:var(--primary)}
.verdict.ng{background:var(--amber-bg);color:var(--amber-ink)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90%;text-align:center}

.choice{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.choice:hover{border-color:var(--teal-2)}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--ok-bg)}
a.btn{text-decoration:none}
.choice .e{grid-row:span 2;font-size:28px}
.choice b{font-size:16px}
.choice small{color:var(--ink2)}
.plan{list-style:none;margin:10px 0;padding:0}
.plan li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
.plan .tm{font-family:var(--game);color:var(--ink2);width:46px;flex:none}
.dest{font-size:24px;font-weight:700;line-height:1.3;margin:4px 0}
/* battle */
.battle{position:fixed;inset:0;z-index:80;background:var(--bg-outer);overflow-y:auto;-webkit-overflow-scrolling:touch}
.b-wrap{max-width:440px;margin:0 auto;min-height:100%;background:var(--paper);padding:env(safe-area-inset-top,0px) 0 calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:480px){.b-wrap{box-shadow:0 0 0 1px var(--line),0 12px 48px rgba(8,50,56,.14)}}
.b-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:3}
.b-title{font-family:var(--game);font-size:19px;color:var(--primary);flex:1}
.b-skip{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 12px;font-weight:700;font-size:13px}
.b-steps{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.b-step{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink2);background:var(--paper)}
.b-step.now{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.b-step.done{background:var(--ok-bg);color:var(--primary);border-color:var(--primary)}
.b-hud{padding:10px 14px 0}
.b-hudrow{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.b-hpt{font-family:var(--game);font-size:14px;color:var(--ink2)}
.hpbar{height:16px;border:2px solid var(--ink);border-radius:8px;background:var(--mist);overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;width:100%;background:var(--amber);transition:width .6s ease-out}

.b-stage{position:relative;height:250px;margin:10px 14px 0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#7CCBD6 0%,#CDEFF2 62%,#EAF8F8 78%)}
@media (max-height:640px){.b-stage{height:200px}}
.b-cloud{position:absolute;top:14%;width:70px;height:20px;border-radius:20px;background:#fff;opacity:.85;box-shadow:24px -8px 0 -2px #fff,44px 2px 0 -4px #fff}
.b-ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#9ED9C0 0 28px,#8CCDB2 28px 56px);border-top:3px solid #5FB08E}
.b-stage.running .b-ground{animation:gscroll .45s linear infinite}
@keyframes gscroll{to{background-position:-56px 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.b-hero{position:absolute;left:7%;bottom:20%;width:76px}
.b-herotag{position:absolute;left:50%;top:-24px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:#0B3B40;background:rgba(255,255,255,.9);border-radius:8px;padding:0 8px}
.b-herobody{animation:bob 1s ease-in-out infinite}
.b-stage.running .b-herobody{animation-duration:.28s}
.b-herobody svg,.b-bossbody svg,.b-sword svg{display:block;width:100%;height:auto;image-rendering:pixelated}
.b-sword{position:absolute;left:60%;bottom:34%;width:30px;transform-origin:50% 92%;transform:rotate(-25deg)}
.b-bosswrap{position:absolute;right:5%;bottom:19%;width:150px}
.b-bossbody{animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}
.b-slash{position:absolute;right:9%;bottom:28%;width:130px;height:130px;opacity:0;pointer-events:none}
.b-slash svg{width:100%;height:100%;display:block}
.b-banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--game);font-size:34px;color:var(--primary);text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;opacity:0;pointer-events:none;letter-spacing:.08em}
.b-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.spark{position:absolute;font-size:18px;color:var(--amber);pointer-events:none}
.dmg{position:absolute;left:70%;top:18%;transform:translateX(-50%);font-family:var(--game);font-size:34px;color:#C2410C;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;opacity:0;pointer-events:none}

.b-cap{margin:12px 14px 0;padding:10px 12px;border-radius:12px;background:var(--mist);border:1.5px solid var(--line)}
.b-wave{font-size:17px;font-weight:700;color:var(--primary)}
.b-sub{font-size:13px;color:var(--ink2)}
.b-log{margin:10px 14px 0;border:1.5px solid var(--line);border-radius:12px;padding:4px 12px;max-height:220px;overflow-y:auto;font-size:14px;line-height:1.6;background:var(--paper)}
.b-log div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.b-log div:last-child{border-bottom:0}
.b-log .hd{font-weight:700;color:var(--primary);border-bottom:1px solid var(--primary)}
.b-log .dm{font-family:var(--game);color:var(--amber-ink);white-space:nowrap}
.b-result{font-size:20px;font-weight:700;color:var(--primary)}
.b-result.lose{color:var(--amber-ink)}
.b-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 14px 0}
.b-act{margin:12px 14px 0;display:flex;flex-direction:column;gap:8px}
.b-act:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;min-height:42px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.stars{display:flex;gap:2px;margin:2px 0 4px}
.star{border:0;background:none;color:var(--amber);font-size:32px;line-height:1;padding:2px 4px;min-height:44px;min-width:40px}
.nav2{grid-template-columns:repeat(3,1fr)}
:lang(zh-CN){--sans:'PingFang SC','Noto Sans SC','Microsoft YaHei','Hiragino Sans GB',system-ui,sans-serif;--game:'PingFang SC','Noto Sans SC','Microsoft YaHei',monospace}
.cxgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 0}
.cx{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:10px 8px}
.cx:hover{border-color:var(--teal-2)}
.cxs{width:96px;height:86px;display:flex;align-items:flex-end;justify-content:center}
.cxs svg{width:100%;height:auto;display:block;image-rendering:pixelated}
.cx small{color:var(--ink2);font-size:12px}
.repcard{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.repcard:hover{border-color:var(--teal-2)}
.repth{display:flex;gap:6px;margin-top:8px}
.repth img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1.5px solid var(--line)}
.repboss{display:inline-block;width:40px}
.repboss svg{width:100%;height:auto;display:block;image-rendering:pixelated}
.b-hudrow .tag{margin-left:8px}
.hpbar.hero i{background:var(--teal-2)}
.b-tag{position:absolute;left:70%;top:34%;transform:translateX(-50%);font-weight:700;font-size:15px;color:#fff;background:#C2410C;border-radius:8px;padding:0 10px;opacity:0;pointer-events:none;white-space:nowrap}
.b-act.cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b-q{grid-column:1/-1;font-weight:700;font-size:14px}
.cmd{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--primary);background:var(--paper);border-radius:12px;padding:8px 10px;min-height:76px}
.cmd b{font-size:15px;color:var(--primary)}
.cmd small{font-size:11.5px;color:var(--ink2);line-height:1.35}
.cmd:hover:not([disabled]){background:var(--ok-bg)}
.cmd[disabled]{border-style:dashed;border-color:var(--line);opacity:.6;cursor:not-allowed}
.b-log .wk{color:#C2410C}
.rules{margin:10px 16px 0;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper)}
.rules summary{font-weight:700;cursor:pointer}
.rules ol{margin:8px 0 2px;padding-left:20px;font-size:13px;color:var(--ink2)}
.rules li{margin:3px 0}
.iconpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.iconpick button{font-size:24px;border:2px solid var(--line);background:var(--paper);border-radius:12px;min-height:46px}
.iconpick button[aria-pressed="true"]{border-color:var(--primary);background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--primary)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

function t(k,v){ let s=(I18N[state.lang]&&I18N[state.lang][k])||I18N.ja[k]||k; if(v){ for(const x in v) s=s.split('{'+x+'}').join(v[x]); } return s; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad2(n){ return String(n).padStart(2,'0'); }
function dstr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayStr(){ return dstr(new Date()); }
function parse(s){ return new Date(s+'T00:00:00'); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return dstr(d); }
function dayCount(trip){ return Math.max(1, Math.round((parse(trip.end)-parse(trip.start))/86400000)+1); }
function fmtDate(s){ try{ return new Intl.DateTimeFormat(({ja:'ja-JP',en:'en-US',zh:'zh-CN'})[state.lang]||'ja-JP',{month:'numeric',day:'numeric',weekday:'short'}).format(parse(s)); }catch(e){ return s; } }
function cur(){ return state.trips.find(x=>x.id===state.tripId); }
function tripStatus(trip){ const n=todayStr(); if(trip.cleared) return {k:'stClear',c:'done'}; if(n<trip.start) return {k:'stPrep',c:''}; if(n>trip.end) return {k:'stEnd',c:'warn'}; return {k:'stNow',c:'warn'}; }
function currentDayOf(trip){ const n=todayStr(); if(n>=trip.start && n<=trip.end) return Math.round((parse(n)-parse(trip.start))/86400000)+1; return state.day; }
function toast(msg){
  const r=document.getElementById('toastRoot'); r.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ r.innerHTML=''; },2200);
}
function readImage(file,max){
  max=max||520;
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.72)); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
function fakeAI(dataUrl){ let h=0; for(let i=0;i<dataUrl.length;i+=97){ h=(h*31+dataUrl.charCodeAt(i))>>>0; } return 52+(h%47); }

/* ================= game logic ================= */
function stats(trip){
  const done=trip.items.filter(i=>i.done); const cnt=c=>done.filter(i=>i.cat===c).length;
  const meals=cnt('meal'), sights=cnt('sight'), moves=cnt('move'), others=cnt('other');
  const stepsVals=Object.values(trip.steps||{}).map(v=>+v||0);
  const steps=stepsVals.reduce((a,b)=>a+b,0); const stepDays=stepsVals.filter(v=>v>=STEP_GOAL).length;
  let pHP=0,pATK=0,pPts=0; const acc=trip.photos.filter(p=>p.accepted);
  acc.forEach(p=>{ const r=PHOTO[p.type]; pHP+=r.hp; pATK+=r.atk; pPts+=r.pts; });
  const cd=trip.cdone||[]; cd.forEach(x=>{ pPts+=x.pts||0; pATK+=x.atk||0; });
  return {
    meals,sights,moves,others,steps,stepDays,photos:acc.length,custom:cd.length,
    hp:Math.min(400,60+30*meals+pHP), lives:Math.min(5,3+Math.floor(meals/3)),
    atk:10+Math.floor(sights/2)+pATK,
    pts:sights*50+meals*20+moves*10+others*10+pPts+Math.floor(steps/200)+stepDays*100,
    done:done.length, speedPt:heroSpeedPt(steps/Math.max(1,dayCount(trip)))
  };
}
function bossMaxHP(trip){ return Math.round((50*dayCount(trip)+7*trip.items.length)*BOSSES[bossIdFor(trip)].hp); }
function dayDamage(trip,d,atk){
  const lines=[]; let dmg=0;
  trip.items.filter(i=>i.day===d&&i.done).sort((a,b)=>(a.time||'').localeCompare(b.time||'')).forEach(i=>{ dmg+=atk; lines.push({icon:CAT[i.cat].e,text:i.title,dmg:atk,cat:i.cat}); });
  trip.photos.filter(p=>p.accepted&&p.day===d).forEach(p=>{ dmg+=15; lines.push({icon:PHOTO[p.type].e,text:t('p_'+p.type),dmg:15,cat:'photo'}); });
  (trip.cdone||[]).filter(x=>x.day===d).forEach(x=>{ dmg+=15; lines.push({icon:x.icon,text:x.title,dmg:15,cat:'custom'}); });
  return {dmg,lines};
}
function finalDamage(st){ return {atk:st.atk*3, pts:Math.floor(st.pts/5), hp:st.hp}; }

    '<div class="b-cap"><div class="b-wave" id="bWave">'+esc(t('bossBattle'))+'</div><div class="b-sub" id="bSub">'+esc(t('battleIntro'))+'</div></div>'+
    '<div class="b-act" id="bAct"></div>'+

  const $=id=>document.getElementById(id); let skip=false;

  const fast=()=>skip||reduceMotion;

  const A=(el,kf,opt)=>{ if(fast()) return Promise.resolve(); try{ return el.animate(kf,opt).finished.catch(()=>{}); }catch(e){ return Promise.resolve(); } };
  let curMax=maxHP;

  const addLog=(html,cls)=>{ const d=document.createElement('div'); if(cls) d.className=cls; d.innerHTML=html; $('bLog').appendChild(d); $('bLog').scrollTop=1e6; };

  const sparks=n=>{

    const dm=$('bDmg'); dm.textContent='-'+n; dm.style.fontSize=big?'44px':'30px';
    A(dm,[{opacity:0,transform:'translate(-50%,10px) scale(.6)'},{opacity:1,transform:'translate(-50%,-10px) scale(1.15)',offset:.2},{opacity:0,transform:'translate(-50%,-48px) scale(1)'}],{duration:big?1000:800});
    if(tag){ const tg=$('bTag'); tg.textContent=tag; A(tg,[{opacity:0,transform:'translate(-50%,6px)'},{opacity:1,transform:'translate(-50%,0)',offset:.2},{opacity:1,transform:'translate(-50%,0)',offset:.7},{opacity:0,transform:'translate(-50%,-8px)'}],{duration:900}); }
    A($('bSlash'),[{opacity:1,transform:'scale(.4) rotate(-20deg)'},{opacity:1,transform:'scale(1.1) rotate(0deg)',offset:.5},{opacity:0,transform:'scale(1.3) rotate(10deg)'}],{duration:big?420:260});
    A($('bBoss'),[{transform:'translateX(0)',filter:'brightness(2.6)'},{transform:'translateX(12px)',offset:.2},{transform:'translateX(-9px)',offset:.4,filter:'brightness(1.4)'},{transform:'translateX(6px)',offset:.6},{transform:'translateX(0)',filter:'brightness(1)'}],{duration:big?420:280});
    if(big){ sparks(8); A($('bStage'),[{transform:'translate(0,0)'},{transform:'translate(-5px,3px)'},{transform:'translate(5px,-3px)'},{transform:'translate(0,0)'}],{duration:200}); }
  };
  const strike=async(n,kind,after,tag,quick)=>{
    const d=dist()*(kind==='light'?.55:1), tot=quick?300:(kind==='light'?460:700);
    const h=A($('bHero'),[{transform:'translateX(0)'},{transform:'translateX('+d+'px)',offset:.4},{transform:'translateX('+d+'px)',offset:.55},{transform:'translateX(0)'}],{duration:tot,easing:'ease-in-out'});
    A($('bSword'),[{transform:'rotate(-25deg)'},{transform:'rotate(-70deg)',offset:.2},{transform:'rotate(100deg)',offset:.42},{transform:'rotate(100deg)',offset:.55},{transform:'rotate(-25deg)'}],{duration:tot});
    await sleep(tot*.42); impact(n,kind,after,tag); await h;
  };
  const finish=async(n,after)=>{
    const d=dist(), tot=1100;
    $('bFlash').style.background='#fff';
    banner(t('finishText'),800);
    const h=A($('bHero'),[{transform:'translate(0,0)'},{transform:'translate('+d*.45+'px,-90px)',offset:.35,easing:'ease-out'},{transform:'translate('+d+'px,-14px)',offset:.62,easing:'ease-in'},{transform:'translate('+d+'px,0)',offset:.7},{transform:'translate('+d+'px,0)',offset:.82},{transform:'translate(0,0)'}],{duration:tot});
    A($('bSword'),[{transform:'rotate(-25deg)'},{transform:'rotate(-120deg)',offset:.35},{transform:'rotate(110deg)',offset:.62},{transform:'rotate(110deg)',offset:.82},{transform:'rotate(-25deg)'}],{duration:tot});
    await sleep(tot*.62);
    A($('bFlash'),[{opacity:.9},{opacity:0}],{duration:420});
    impact(n,'finish',after); await h;
  };
  const bossStrike=async(guard)=>{
    const d=dist(), tot=800;
    const b=A($('bBoss'),[{transform:'translateX(0)'},{transform:'translateX('+(-d)+'px)',offset:.4},{transform:'translateX('+(-d)+'px)',offset:.55},{transform:'translateX(0)'}],{duration:tot,easing:'ease-in-out'});
    await sleep(tot*.42);
    $('bFlash').style.background=guard?'#3B82F6':'#FF3B30';
    A($('bFlash'),[{opacity:.5},{opacity:0}],{duration:450});
    if(!guard) A($('bHero'),[{transform:'translateX(0)',filter:'brightness(3)'},{transform:'translateX(-16px)',offset:.3,filter:'brightness(1.6)'},{transform:'translateX(0)',filter:'brightness(1)'}],{duration:500});
    await b;
  };
  const winAnim=async()=>{
    A($('bBoss'),[{opacity:1,transform:'translateY(0) scale(1)',filter:'brightness(3)'},{opacity:.9,transform:'translateY(0) scale(1)',filter:'brightness(1)',offset:.2},{opacity:0,transform:'translateY(40px) scale(.7)',filter:'grayscale(1)'}],{duration:1200});
    sparks(14); await sleep(1200); $('bBoss').style.opacity='0'; sparks(10);
    await A($('bHero'),[{transform:'translateY(0)'},{transform:'translateY(-26px)',offset:.5},{transform:'translateY(0)'}],{duration:500,iterations:3});
  };

  async function fight(){
    const tries=trip.battleTries||0, bonus=1+0.15*tries;
    curMax=Math.round(maxHP*Math.max(0.3,1-0.15*tries));
    let hp=curMax, hHP=heroMax, phase2=false;
    setHP(hp); setHero(hHP); $('bLog').innerHTML=''; $('bBoss').style.opacity=''; $('bPhase').textContent=''; skip=false;
    const bt=$('bBonus'); if(tries){ bt.style.display=''; bt.textContent=t('bonusTag',{p:tries*15}); } else bt.style.display='none';
    addLog('<b>'+esc(t('introLog',{n:bn}))+'</b>','hd');
    const checkPhase=async()=>{ if(!phase2&&hp>0&&hp<curMax*0.5){ phase2=true; $('bPhase').textContent='⚠ '+t('phase2'); addLog('<b>⚠ '+esc(t('phase2Log'))+'</b>','hd'); await banner(t('phase2'),900); } };
    for(let d=1; d<=days; d++){
      const c=calcDay(trip,d,st,B,bonus);
      setStep(d-1); $('bWave').textContent=t('waveSub',{d:d});
      $('bSub').textContent=t('spdLine',{s:c.steps.toLocaleString(),h:c.heroPt,b:c.bossPt,r:(c.bossPt/c.heroPt).toFixed(2),k:c.k});
      $('bSpd').textContent='⚡ '+t('bossSpd',{n:c.bossPt})+' / '+t('heroName')+' '+c.heroPt;
      addLog('<b>▶ '+esc(t('waveSub',{d:d}))+'</b>','hd');
      addLog('<span class="muted" style="font-size:12px">'+esc(t('spdLine',{s:c.steps.toLocaleString(),h:c.heroPt,b:c.bossPt,r:(c.bossPt/c.heroPt).toFixed(2),k:c.k}))+'</span>');
      $('bStage').classList.add('running'); await banner(t('chipDay',{d:d}),800); $('bStage').classList.remove('running'); await sleep(100);
      if(!c.acts.length){ addLog('<span>'+esc(t('noRecord'))+'</span><span class="dm">−0</span>'); await sleep(300); }
      for(const a of c.acts){
        addLog('<span>'+esc(a.l.icon)+' '+esc(a.l.text)+(a.weak?' <b class="wk">'+esc(t('weakHit'))+'</b>':'')+(a.k>1?' <b>'+esc(t('hitsX',{k:a.k}))+'</b>':'')+'</span><span class="dm">−'+a.total+'</span>');
        for(let j=0;j<a.k;j++){
          const tag=(j===0&&a.weak)?t('weakHit'):(a.k>1?(j+1)+'/'+a.k:'');
          await strike(a.per,a.weak?'heavy':'light',()=>{ hp-=a.per; setHP(hp); },tag,a.k>1);
          await checkPhase();
          if(hp<=0) return 'win';
        }
      }
      const dmg=Math.max(1,Math.round(bossAtk*(phase2?1.4:1)));
      await bossStrike(false); hHP-=dmg; setHero(hHP);
      addLog('<span>'+esc(t('counterLog',{n:dmg}))+'</span><span class="dm">♥ −'+dmg+'</span>');
      if(hHP<=0) return 'lose';
      await sleep(200);
    }
    setStep(days); $('bWave').textContent=t('finalB'); $('bSub').textContent=t('finalHow'); addLog('<b>▶ '+esc(t('finalB'))+'</b>','hd');
    $('bStage').classList.add('running'); await banner(t('finalB'),1000); $('bStage').classList.remove('running'); await sleep(100);
    const rows=finalRows(st,trip,B,bonus);
    const labels=[['⚔',t('fAtkX',{n:st.atk})],['✦',t('fPtsX',{n:st.pts})],['👟',t('finalAddX',{n:st.atk,k:rows[2].k})]];
    for(let i=0;i<rows.length;i++){
      const v=rows[i].v, last=i===rows.length-1;
      addLog('<span>'+labels[i][0]+' '+esc(labels[i][1])+'</span><span class="dm">−'+v+'</span>');
      const after=()=>{ hp-=v; setHP(hp); };
      if(last) await finish(v,after); else await strike(v,'heavy',after);
    }
    addLog('<b>'+esc(t('sumLine',{d:curMax-Math.max(hp,0),h:curMax}))+'</b>','hd');
    if(hp<=0) return 'win';
    await bossStrike(false);
    addLog('<span>'+esc(t('shortBy',{n:hp}))+'</span>');
    return 'lose';
  }

  (async function main(){
    while(true){
      const res=await fight();
      if(res==='win'){
        const first=!(state.codex[bid]&&state.codex[bid].log.some(x=>x.tripId===trip.id));
        setStep(days+1); await winAnim();
        addLog('<div class="b-result" style="width:100%;justify-content:center">👑 '+esc(t('win'))+'</div>');
        trip.cleared=true; trip.bossId=bid; trip.bossResult={attempts:(trip.battleTries||0)+1,at:Date.now(),bossId:bid};
        const isNew=recordWin(trip)&&first; save();
        try{ await makeReport(trip); }catch(e){}
        if(isNew) addLog('<div class="b-result" style="width:100%;justify-content:center">🆕 '+esc(t('newBoss'))+'</div>');
        const v=await choose([{label:'📚 '+t('seeCodex'),v:'codex',cls:'amber'},{label:'📖 '+t('seeMem'),v:'mem'},{label:t('bye'),v:'x',cls:'ghost'}]);
        close();
        if(v==='codex'){ state.view='home'; state.homeTab='records'; state.recTab='codex'; state.tripId=null; }
        else state.tab=v==='mem'?'mem':'boss';
        render(); window.scrollTo(0,0); return;
      }
      trip.battleTries=(trip.battleTries||0)+1; save();
      addLog('<div class="b-result lose" style="width:100%;justify-content:center">'+esc(t('lose'))+'</div>');
      addLog('<span class="b-sub">'+esc(t('defeatHint'))+'</span>');
      await choose([{label:t('bye'),v:'x',cls:'ghost'}]);
      close(); render(); return;
    }
  })();
}

const ICONS=['⭐','🍰','☕','🛍️','🐾','🌸','🎨','🏞️'];
const CTIER={s:{pts:20,atk:0},m:{pts:40,atk:0},l:{pts:80,atk:1}};
function customSection(trip){
  const day=currentDayOf(trip), list=trip.custom||[], done=trip.cdone||[];
  let h='<section class="sec" id="cqSection" style="padding-top:20px"><h2>'+esc(t('cqTitle'))+'</h2><p class="muted" style="margin:4px 0 0;font-size:13px">'+esc(t('cqDesc'))+'</p>';
  if(list.length){
    h+='<div class="pgrid">';
    list.forEach(q=>{
      const n=done.filter(x=>x.qid===q.id).length, dn=done.some(x=>x.qid===q.id&&x.day===day);
      h+='<button class="pq" data-act="cOpen" data-id="'+q.id+'"><div class="e" aria-hidden="true">'+esc(q.icon)+'</div><div class="n">'+esc(q.title)+'</div><span class="r">'+esc(t('ct_'+q.tier))+'</span><div class="c">'+(dn?'✔ '+esc(t('cqDoneToday')):esc(t('cqCount',{n:n})))+'</div></button>';
    });
    h+='</div>';
  } else h+='<div class="empty" style="margin:10px 0">'+esc(t('cqEmpty'))+'</div>';
  h+='<div style="margin-top:10px"><button class="btn ghost block" data-act="cNew">'+esc(t('cqNew'))+'</button></div></section>';
  return h;
}
function cquestBody(){
  const trip=cur(), q=(trip.custom||[]).find(x=>x.id===modal.id);
  if(!q) return '<button class="btn ghost block" data-act="closeModal">'+esc(t('close'))+'</button>';
  const day=currentDayOf(trip), dn=(trip.cdone||[]).some(x=>x.qid===q.id&&x.day===day);
  let h='<h2>'+esc(q.icon)+' '+esc(q.title)+'</h2><div class="row wrap" style="margin:4px 0 8px"><span class="tag">'+(q.proof==='photo'?'📷 '+esc(t('cqProofPhoto')):'👆 '+esc(t('cqProofTap')))+'</span><span class="tag">'+esc(t('cqLimit'))+'</span></div>'+

  } else h+='<button class="btn amber block" data-act="cDone">✔ '+esc(t('cqDo'))+'</button>';
  h+='<div class="row wrap" style="margin-top:10px"><button class="btn ghost" data-act="cEdit">'+esc(t('cqEdit'))+'</button><button class="btn ghost" data-act="closeModal">'+esc(t('close'))+'</button></div>';

function ceditBody(){
  const d=modal.draft;
  let icons=''; ICONS.forEach(i=>{ icons+='<button type="button" data-act="cIcon" data-icon="'+i+'" aria-pressed="'+(d.icon===i)+'">'+i+'</button>'; });

function captureC(){
  if(!modal||modal.type!=='cedit') return; const g=id=>document.getElementById(id);
  if(g('cTitle')){ modal.draft.title=g('cTitle').value; modal.draft.tier=g('cTier').value; modal.draft.proof=g('cProof').value; }
}
async function onCPhoto(e){
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  try{ modal.img=await readImage(f); renderModal(); }catch(err){}
}
actions.cNew=function(){ openModal({type:'cedit',id:null,draft:{title:'',icon:ICONS[0],tier:'m',proof:'tap'}}); };
actions.cOpen=function(el){ openModal({type:'cquest',id:el.dataset.id,img:null}); };
actions.cEdit=function(){
  const q=(cur().custom||[]).find(x=>x.id===modal.id); if(!q) return;
  openModal({type:'cedit',id:q.id,draft:{title:q.title,icon:q.icon,tier:q.tier,proof:q.proof}});
};
actions.cIcon=function(el){ captureC(); modal.draft.icon=el.dataset.icon; renderModal(); };
actions.cSave=function(){
  captureC(); const d=modal.draft, trip=cur();
  if(!d.title.trim()) return toast(t('cqNeedTitle'));
  trip.custom=trip.custom||[];
  if(modal.id){ const q=trip.custom.find(x=>x.id===modal.id); if(q) Object.assign(q,{title:d.title.trim(),icon:d.icon,tier:d.tier,proof:d.proof}); }
  else trip.custom.push({id:uid(),title:d.title.trim(),icon:d.icon,tier:d.tier,proof:d.proof});
  save(); closeModal(); render();
};
actions.cDel=function(){
  if(!modal.armDel){ captureC(); modal.armDel=true; return renderModal(); }
  const trip=cur(); trip.custom=(trip.custom||[]).filter(x=>x.id!==modal.id); save(); closeModal(); render();
};
actions.cDone=function(){
  const trip=cur(), q=(trip.custom||[]).find(x=>x.id===modal.id); if(!q) return;
  const day=currentDayOf(trip); trip.cdone=trip.cdone||[];
  if(trip.cdone.some(x=>x.qid===q.id&&x.day===day)) return;
  if(q.proof==='photo'&&!modal.img) return toast(t('cqNeedPhoto'));
  const r=CTIER[q.tier];
  trip.cdone.push({id:uid(),qid:q.id,title:q.title,icon:q.icon,tier:q.tier,pts:r.pts,atk:r.atk,img:q.proof==='photo'?modal.img:null,day:day,at:Date.now()});
  save(); const tier=q.tier; closeModal(); render(); toast(t('cqDone')+' '+t('ct_'+tier));
};
actions.viewCPhoto=function(el){ const x=(cur().cdone||[]).find(v=>v.id===el.dataset.id); if(x&&x.img) openModal({type:'view',src:x.img}); };

function hav(a,b,c,d){ const R=6371, r=x=>x*Math.PI/180, dl=r(c-a), dn=r(d-b); const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function travelMin(km,mode){ const m=mode==='car'?10+km*1.25:15+km*1.2/65*60; return Math.round(m/5)*5; }
function originOf(o){ if(o.id==='here') return {label:t('rndHere')}; const x=ORIGINS.find(v=>v[0]===o.id); return {label:x?(state.lang==='en'?x[2]:x[1]):''}; }
function modeShort(mode){ return t(mode==='car'?'rndCarShort':'rndTransitShort'); }
function pickCand(mode,o,seen){
  const all=DEST.filter(d=>mode==='car'||d[6].indexOf('t')>=0).map(d=>{ const km=hav(o.lat,o.lng,d[3],d[4]); return {d:d,km:Math.round(km),min:travelMin(km,mode)}; }).filter(c=>c.min>=30&&c.min<=150);
  if(!all.length) return null;
  let pool=all.filter(c=>seen.indexOf(c.d[0])<0); if(!pool.length){ pool=all; seen.length=0; }
  return pool[Math.floor(Math.random()*pool.length)];
}
function buildPlan(c,mode){
  const d=c.d, T=c.min, L=state.lang==='en'?1:0, name=L?d[2]:d[1], sights=(L?d[8]:d[7]).slice(0,(state.profile&&state.profile.pace==='relaxed')?2:3), food=L?d[10]:d[9], k=modeShort(mode);
  const fmt=m=>pad2(Math.floor(m/60))+':'+pad2(m%60), LIMIT=21*60;
  let tm=departMin(); const items=[];
  items.push({time:fmt(tm),title:t('rndGoTo',{n:name,k:k,m:T}),place:'',cat:'move'}); tm+=T;
  let lunch=false, extra=false, guard=0;
  while(guard++<8){
    let kind;
    if(!lunch&&tm>=11*60) kind='lunch'; else if(sights.length) kind='sight'; else if(!lunch) kind='lunch'; else if(!extra) kind='extra'; else break;
    const dur=kind==='lunch'?60:kind==='sight'?75:30;
    if(kind==='lunch'&&tm<11*60) tm=11*60;
    if(tm+dur+T>LIMIT) break;
    if(kind==='sight'){ const sp=sights.shift(); items.push({time:fmt(tm),title:sp,place:name,cat:'sight',q:sp+' '+name,specific:true}); }
    else if(kind==='lunch'){ items.push({time:fmt(tm),title:t('rndLunch',{f:food}),place:name,cat:'meal',q:name+' '+food,specific:false}); lunch=true; }
    else { items.push({time:fmt(tm),title:t('rndExtra'),place:name,cat:'other',q:name+(L?' souvenirs':' お土産'),specific:false}); extra=true; }
    tm+=dur;
  }
  items.push({time:fmt(tm),title:t('rndBackTrip',{k:k,m:T}),place:'',cat:'move'}); tm+=T;
  return {name:name,km:c.km,min:T,items:items,home:fmt(tm),themes:d[5].split(',')};
}

actions.rndLocate=function(){
  captureWish();
  if(!navigator.geolocation){ modal.err=t('rndErrOther'); return renderModal(); }
  modal.stage='busy'; modal.err=''; renderModal();
  navigator.geolocation.getCurrentPosition(function(pos){
    if(!modal||modal.type!=='random') return;
    modal.origin={id:'here',lat:pos.coords.latitude,lng:pos.coords.longitude}; actions.rndRoll();
  },function(err){
    if(!modal||modal.type!=='random') return;
    modal.stage='loc'; modal.err=(err&&err.code===1)?t('rndErrDenied'):t('rndErrOther'); renderModal();
  },{enableHighAccuracy:false,timeout:12000,maximumAge:600000});
};
actions.rndPickOrigin=function(){

actions.rndRoll=function(){

function aiCands(mode,o){
  const all=DEST.filter(d=>mode==='car'||d[6].indexOf('t')>=0).map(d=>({d:d,min:travelMin(hav(o.lat,o.lng,d[3],d[4]),mode)})).filter(c=>c.min>=30&&c.min<=150);

function sanitizePlan(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.items)) return null;
  const clip=(s,n)=>String(s==null?'':s).replace(/[\u0000-\u001f]/g,' ').trim().slice(0,n);
  const name=clip(d.destination,40), T=Math.round((+d.oneWayMin)/5)*5;

  const cats=['move','sight','meal','other'], themes=['history','gourmet','nature','onsen','sea','view'];
  const toMin=s=>{ const p=s.split(':'); return (+p[0])*60+(+p[1]); }, fmt=m=>pad2(Math.floor(m/60))+':'+pad2(m%60);
  let items=d.items.map(i=>{ const tm=String(i&&i.time||'').trim(); return {time:/^([01]?\d|2[0-3]):[0-5]\d$/.test(tm)?fmt(toMin(tm)):null,title:clip(i&&i.title,60),place:clip(i&&i.place,40),q:clip(i&&i.query,80),sp:(typeof (i&&i.specific)==='boolean')?i.specific:null,cat:cats.indexOf(i&&i.cat)>=0?i.cat:'other'}; }).filter(i=>i.time&&i.title);
  if(items.length<3) return null;
  items.forEach(i=>{ if(i.cat==='move'){ i.q=''; i.specific=true; } else { if(!i.q) i.q=(i.title+' '+i.place).trim(); i.specific=(typeof i.sp==='boolean')?i.sp:(i.cat==='sight'); } delete i.sp; });
  items.sort((a,b)=>a.time.localeCompare(b.time)); items=items.slice(0,12);
  const last=items[items.length-1], home=toMin(last.time)+(last.cat==='move'?T:30);
  if(home>22*60) return null;
  return {ai:true,name:name,min:T,items:items,home:fmt(home),themes:(Array.isArray(d.themes)?d.themes:[]).filter(x=>themes.indexOf(x)>=0).slice(0,3),reason:clip(d.reason,160),tips:clip(d.tips,120)};
}

actions.rndAI=async function(){
  const m=modal; m.stage='aiBusy'; m.err=''; m.note=''; renderModal();

  if(P.pace==='relaxed') L.push('- Pace: relaxed (fewer stops, longer breaks)'); else if(P.pace==='packed') L.push('- Pace: packed (as many highlights as realistic)');
  if(P.walk==='little') L.push('- Walking: prefers little walking'); else if(P.walk==='lots') L.push('- Walking: happy to walk a lot');
  if(P.budget==='saving') L.push('- Budget: budget-conscious'); else if(P.budget==='luxury') L.push('- Budget: happy to splurge on food and experiences');
  if(P.who) L.push('- Travelling with: '+P.who);

  if(P.avoid) L.push('- Wants to avoid: '+cleanTxt(P.avoid,200));

    const cnt={}; P.ratings.forEach(r=>(r.tags||[]).forEach(x=>{ cnt[x]=(cnt[x]||0)+1; }));

}

function genMonster(sp){
  const W=20,H=18, g=[]; for(let r=0;r<H;r++) g.push(new Array(W).fill('.'));
  const set=(x,y,c)=>{ if(x>=0&&x<W&&y>=0&&y<H) g[y][x]=c; };
  const get=(x,y)=>(x>=0&&x<W&&y>=0&&y<H)?g[y][x]:'.';
  // body from half-width profile
  sp.hw.forEach((w,r)=>{ for(let x=10-w;x<10+w;x++) set(x,r,'b'); });
  if(sp.cut) sp.cut(g,set,get);
  // outline / shading
  const filled=(x,y)=>get(x,y)!=='.';

    if(!filled(x,y)) continue;
    const edge=!filled(x-1,y)||!filled(x+1,y)||!filled(x,y-1)||!filled(x,y+1);
    if(edge) o.push([x,y,'o']);
    else if(!filled(x+2,y)||!filled(x,y+2)||!filled(x+1,y+1)) o.push([x,y,'k']);
    else if(!filled(x-2,y)&&!filled(x,y-1)) o.push([x,y,'l']);
  }
  o.forEach(a=>set(a[0],a[1],a[2]));
  (sp.extras||[]).forEach(f=>f(set,get,g));

}

function bossIdFor(trip){

/* ================= speed battle rules ================= */
const MAX_HITS=4;
function heroSpeedPt(steps){ return Math.max(20,100-Math.floor((+steps||0)/150)); }
function hitsPerAction(heroPt,bossPt){ return Math.max(1,Math.min(MAX_HITS,Math.floor(bossPt/heroPt+1e-9))); }
function calcDay(trip,d,st,B,bonus){
  const steps=+(trip.steps&&trip.steps[d])||0, hpt=heroSpeedPt(steps), k=hitsPerAction(hpt,B.spd), r=dayDamage(trip,d,st.atk);
  const acts=r.lines.map(l=>{ const weak=l.cat===B.weak, per=Math.round(l.dmg*bonus*(weak?1.5:1)); return {l:l,weak:weak,per:per,k:k,total:per*k}; });
  return {steps:steps,heroPt:hpt,bossPt:B.spd,k:k,acts:acts,total:acts.reduce((a,x)=>a+x.total,0)};
}
function finalRows(st,trip,B,bonus){
  const avg=(st.steps||0)/dayCount(trip), k=hitsPerAction(heroSpeedPt(avg),B.spd);
  return [{key:'atk',n:st.atk,v:Math.round(st.atk*3*bonus)},{key:'pts',n:st.pts,v:Math.round(Math.floor(st.pts/8)*bonus)},{key:'add',n:st.atk,k:k,v:Math.round(st.atk*k*bonus)}];
}
function totalPower(trip){
  const st=stats(trip), B=BOSSES[bossIdFor(trip)], bonus=1+0.15*(trip.battleTries||0); let sum=0;
  for(let d=1;d<=dayCount(trip);d++) sum+=calcDay(trip,d,st,B,bonus).total;
  return sum+finalRows(st,trip,B,bonus).reduce((a,r)=>a+r.v,0);
}

/* ---- codex ---- */
function recordWin(trip){
  const id=bossIdFor(trip), c=state.codex[id]||(state.codex[id]={id:id,count:0,first:0,last:0,log:[]});
  const at=(trip.bossResult&&trip.bossResult.at)||Date.now();
  const had=c.log.some(x=>x.tripId===trip.id);
  c.log=c.log.filter(x=>x.tripId!==trip.id); c.log.unshift({tripId:trip.id,name:trip.name,dest:trip.dest,at:at,attempts:(trip.bossResult&&trip.bossResult.attempts)||1});
  c.log=c.log.slice(0,10); c.count=Math.max(c.count+(had?0:1),1); c.first=c.first||at; c.last=at;
  return !had&&c.count===1;
}
function backfillCodex(){
  let ch=false;
  state.trips.forEach(tr=>{ if(tr.cleared){ const id=bossIdFor(tr), c=state.codex[id]; if(!c||!c.log.some(x=>x.tripId===tr.id)){ recordWin(tr); ch=true; } } });
  if(ch) save();
}

/* ---- reports ---- */
function thumbOf(src,max){
  return new Promise(res=>{ try{
    const im=new Image();
    im.onload=()=>{ try{ const s=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.6)); }catch(e){ res(null); } };
    im.onerror=()=>res(null); im.src=src;
  }catch(e){ res(null); } });
}
async function makeReport(trip){
  const st=stats(trip), days=dayCount(trip);
  const done=trip.items.filter(i=>i.done).sort((a,b)=>a.day-b.day||(a.time||'').localeCompare(b.time||''));
  const srcs=[]; done.forEach(i=>{ if(i.photo) srcs.push(i.photo); }); trip.photos.filter(p=>p.accepted).forEach(p=>srcs.push(p.img)); (trip.cdone||[]).forEach(x=>{ if(x.img) srcs.push(x.img); });
  const thumbs=[]; for(const s of srcs.slice(0,6)){ const th=await thumbOf(s,200); if(th) thumbs.push(th); }
  const rec=ratingOf(trip), old=state.reports.find(r=>r.tripId===trip.id);
  const rep={id:old?old.id:uid(),tripId:trip.id,name:trip.name,dest:trip.dest,start:trip.start,end:trip.end,days:days,at:Date.now(),
    bossId:bossIdFor(trip),cleared:!!trip.cleared,attempts:(trip.bossResult&&trip.bossResult.attempts)||0,
    stats:{pts:st.pts,steps:st.steps,sights:st.sights,meals:st.meals,photos:st.photos,custom:st.custom,done:st.done,total:trip.items.length},
    items:done.map(i=>({day:i.day,time:i.time,title:i.title,place:i.place,cat:i.cat})),
    custom:(trip.cdone||[]).map(x=>({day:x.day,title:x.title,icon:x.icon})),thumbs:thumbs,stars:rec?rec.stars:0};
  state.reports=state.reports.filter(r=>r.tripId!==trip.id); state.reports.unshift(rep); state.reports=state.reports.slice(0,30);
  save(); return rep;
}

function cdbInit(){
  if(CDB.tried||spotsUrl()) return; CDB.tried=true;
  if(!window.claude||typeof window.claude.use!=='function') return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(async function(r){
    const db=r[0], user=r[1]; if(!db) return; CDB.db=db;
    try{ CDB.uid=user?await user.id():null; }catch(e){}
    try{ CDB.canWrite=user?await user.can('data.write'):null; }catch(e){}
    const tm=setTimeout(()=>{ if(!CDB.ready){ CDB.err=t('smDbSlow'); smRerender(); } },10000);
    db.collection('spots').onSnapshot(q=>{ CDB.spots=q.docs.map(d=>Object.assign({},d.data(),{id:d.id})); CDB.ready=true; CDB.err=''; clearTimeout(tm); smRerender(); },()=>{ CDB.err=t('smErrLoad'); smRerender(); });
    db.collection('reacts').onSnapshot(q=>{ const m={}; q.docs.forEach(d=>{ const v=d.data(); if(!v||!v.sid) return; const e=m[v.sid]||(m[v.sid]={c:0,r:0,me:null}); if(v.k==='c') e.c++; else if(v.k==='r') e.r++; if(CDB.uid&&v.uid===CDB.uid) e.me=v.k; }); CDB.reacts=m; smRerender(); },()=>{});

}

      '<h2 style="margin:18px 0 10px">'+esc(t('cvdTitle'))+'</h2><button class="choice" data-act="cvdToggle" aria-pressed="'+state.cvd+'"><span class="e" aria-hidden="true">'+(state.cvd?'✔':'—')+'</span><b>'+esc(t('cvdOn'))+'</b><small>'+esc(t('cvdSub'))+'</small></button>'+
      '<div style="margin-top:10px"><div class="muted" style="font-size:12px;margin-bottom:4px">'+esc(t('cvdSample'))+'</div><div class="row wrap"><span class="tag done">'+esc(t('cvdOk'))+'</span><span class="tag warn">'+esc(t('cvdWarn'))+'</span><span class="tag">'+esc(t('cvdNg'))+'</span></div></div></div>';
  }
  return h+'<div class="pad" style="padding-top:6px"><button class="btn ghost block" data-act="settings">⚙ '+esc(t('prefAdvanced'))+'</button></div>';
}
actions.prefs=function(){ if(modal){ modal=null; renderModal(); } state.prevView=state.view==='prefs'?(state.prevView||'home'):state.view; state.view='prefs'; render(); window.scrollTo(0,0); };
actions.prefsBack=function(){ state.view=state.prevView||'home'; if(state.view==='trip'&&!cur()) state.view='home'; render(); };
actions.prefTab=function(el){ state.prefTab=el.dataset.tab; render(); };
actions.themeSet=function(el){ const v=el.dataset.v; state.theme=['auto','light','dark'].includes(v)?v:'auto'; save(); render(); };
actions.cvdToggle=function(){ state.cvd=!state.cvd; save(); render(); };

actions.goCQuest=function(){ state.tab='quest'; render(); setTimeout(function(){ const e=document.getElementById('cqSection'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'start'}); else window.scrollTo(0,0); },0); };

load(); applyConfig(); backfillCodex(); ensureAI(); render();
})();
